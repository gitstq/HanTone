[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hantone"
version = "1.0.0"
description = "HanTone — 零依赖 · 离线优先的汉字拼音转换引擎（多音字词组级消歧 / 注音 / 变调 / 中文排序）"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HanTone Contributors" }]
keywords = ["pinyin", "chinese", "hanzi", "zhuyin", "bopomofo", "mandarin", "offline", "zero-dependency"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: Chinese (Traditional)",
]
# 核心卖点：运行时零第三方依赖，仅使用 Python 标准库
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.0", "twine>=4.0"]

[project.urls]
Homepage = "https://github.com/gitstq/HanTone"
Repository = "https://github.com/gitstq/HanTone"
Issues = "https://github.com/gitstq/HanTone/issues"

[project.scripts]
hantone = "hantone.cli:main"

[tool.setuptools]
packages = ["hantone"]

[tool.setuptools.package-data]
hantone = ["py.typed"]
